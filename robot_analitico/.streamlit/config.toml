# Configuración de Streamlit para la app (robot_analitico/app.py).
# Streamlit lee este archivo desde la carpeta del script principal, así que
# aplica igual al correr localmente (`streamlit run app.py`) y en Streamlit Cloud.

[theme]
base="dark"
primaryColor="#34C9A0"
backgroundColor="#0A0F1C"
secondaryBackgroundColor="#121A2B"
textColor="#E8EDF6"
font="sans serif"
